<style>
:root{
  --bg:#F2F3F0; --side:#E9ECE8; --surface:#FFFFFF; --ink:#1A2229; --muted:#5A6670; --rule:#D3D8D6;
  --accent:#1F7A6D; --danger:#B3261E; --c-books:#24365C; --c-tools:#9A6A00; --c-notes:#1F7A6D; --c-featured:#7A4A70; --c-other:#5A6670;
  --mark:#FBE7A6;
  --serif:"Noto Serif SC","Songti SC","STSong",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121619; --side:#161B1F; --surface:#1B2125; --ink:#E4E9EA; --muted:#9AA7AE; --rule:#2C363C;
    --danger:#F2A7A0; --accent:#5CC2B1; --c-books:#8EA6D9; --c-tools:#E0B04A; --c-notes:#5CC2B1; --c-featured:#C99BC0; --c-other:#9AA7AE;
    --mark:#5C4A12;
  }
}
:root[data-theme="dark"]{
  --bg:#121619; --side:#161B1F; --surface:#1B2125; --ink:#E4E9EA; --muted:#9AA7AE; --rule:#2C363C;
  --danger:#F2A7A0; --accent:#5CC2B1; --c-books:#8EA6D9; --c-tools:#E0B04A; --c-notes:#5CC2B1; --c-featured:#C99BC0; --c-other:#9AA7AE;
  --mark:#5C4A12;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7}
body.reading,body.drawer{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;font-size:14px;line-height:1.4;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.sub{color:var(--accent);border-color:var(--accent);font-weight:600}
.btn.sub:hover{background:var(--accent);color:var(--surface);border-color:var(--accent)}
/* ---------- tags, the "my shelf | public directory" switch, directory cards ---------- */
.seg.space{margin-top:10px}
.seg.space button{padding:4px 12px;font-weight:600}
.tagbox{margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.kw{display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--bg);color:var(--muted);border-radius:999px;padding:1px 9px;font:inherit;font-size:12.5px;line-height:1.6;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw:hover{border-color:var(--muted);color:var(--ink)}
.kw[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kw em{font-style:normal;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.tagbox .kw{background:var(--surface)}
.tagbox .kw[aria-pressed="true"]{background:var(--ink)}
.card .chips{margin:0 0 10px}
.view-head .chip{margin:8px 8px 0 0;cursor:pointer}
a.cover{text-decoration:none;color:inherit}
.shelf-link{border:0;background:none;padding:0;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-link:hover{color:var(--ink)}
.more-row{max-width:1280px;padding:24px 0;text-align:center}
.shelf-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.shelf-row:hover{background:var(--surface);color:var(--ink)}
.shelf-row[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.shelf-row span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-row .n{font-size:12px;font-variant-numeric:tabular-nums}
#submitDlg{width:min(560px,calc(100vw - 24px))}
#submitTabs{margin:0 0 12px}
.hp{position:absolute !important;left:-9999px !important;width:1px !important;height:1px !important;opacity:0 !important}
.counter{margin:4px 0 0;font-size:12.5px;color:var(--muted);text-align:right}
.counter.bad{color:var(--danger)}
.result-line{min-height:1.4em;margin:10px 0 0;font-size:14px;line-height:1.6}
.result-line.bad{color:var(--danger)}
.result-line.good{color:var(--accent);font-weight:600}
.check-card{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:12px 0 0;background:var(--bg)}
.check-card .chk-title{margin:0 0 6px;color:var(--accent);font-weight:600;font-size:14px}
table.chk{border-collapse:collapse;width:100%;font-size:13.5px}
table.chk th{text-align:left;color:var(--muted);font-weight:500;padding:2px 12px 2px 0;vertical-align:top;white-space:nowrap}
table.chk td{padding:2px 0;word-break:break-word}
.chk-sub{margin:8px 0 2px;color:var(--muted);font-size:13px}
.chk-list{margin:0;padding-left:1.2em;font-size:13.5px}
.where.good{color:var(--accent);border-color:var(--accent)}
.where.warn{color:var(--c-tools);border-color:var(--c-tools)}
.card-foot{flex-wrap:wrap}
.card-foot .acts{flex-wrap:wrap;justify-content:flex-end}
.kind-line{min-height:1.6em;margin:8px 0 0;font-size:13.5px;color:var(--accent);font-weight:600}
.kind-line.bad{color:var(--danger)}
.sub-scope{margin:0 0 12px}
.sub-scope select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:7px 9px}
details.how{margin:14px 0 0;font-size:13.5px;color:var(--muted);line-height:1.7}
details.how summary{cursor:pointer;color:var(--ink);font-weight:600}
details.how ol{margin:6px 0 0;padding-left:1.3em}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);text-decoration:none}
.ibtn:hover{background:var(--bg);color:var(--ink)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--rule)}
.side-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:22px 18px 10px 22px}
.brand{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.25;margin:0}
.brand-sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.side-close{display:none}
.side-scroll{flex:1;overflow-y:auto;padding:6px 12px 20px 14px}
.cats{display:flex;flex-direction:column;gap:2px;margin:6px 0 18px}
.cat-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:15px}
.cat-btn:hover{background:var(--surface)}
.cat-btn[aria-current="true"]{background:var(--surface);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.cat-btn .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c-other)}
.cat-btn .n{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dir-label{font-size:12.5px;color:var(--muted);margin:0 10px 6px;display:flex;justify-content:space-between}
.dir{list-style:none;margin:0;padding:0}
/* directory: every category is a coloured block with a strong, clickable heading; a long list folds after 3 entries */
.dir-group{margin:0 0 14px;border-left:2px solid var(--rule);border-left-color:color-mix(in srgb,var(--gc,var(--c-other)) 55%,transparent);border-radius:0 0 0 2px}
.dir-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:5px 8px 5px 10px;margin:0 0 2px;border-radius:0 6px 6px 0;font-size:14px;font-weight:700;line-height:1.3;color:var(--ink);cursor:pointer;text-align:left}
.dir-head:hover{background:var(--surface)}
.dir-head .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--gc,var(--c-other))}
.dir-head .n{margin-left:auto;min-width:20px;padding:0 7px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:12px;font-weight:600;line-height:1.5;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.dir-item{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 10px 5px 12px;border-radius:5px;font-size:13.5px;line-height:1.45;color:var(--muted);cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dir-item:hover{background:var(--surface);color:var(--ink)}
.dir-more{display:block;border:0;background:none;padding:3px 10px 3px 12px;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}
.dir-more:hover{text-decoration:underline}
.side-foot{border-top:1px solid var(--rule);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:10px}
.source{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.source b{color:var(--ink);font-weight:600}
.legal-links{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.legal-links a{color:inherit}
.foot-row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.main{min-width:0;padding:0 clamp(16px,3.2vw,44px) 72px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding:14px 0 12px;background:var(--bg);border-bottom:1px solid var(--rule)}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 40px 8px 36px;outline:none}
.search input:focus{border-color:var(--accent)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 6px;background:var(--bg)}
.toolbar{display:flex;align-items:center;gap:8px;margin-left:auto}
.toolbar select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}

.view-head{max-width:1280px;padding:34px 0 18px}
.view-head h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,3.8vw,44px);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.view-head p{margin:0;color:var(--muted);font-size:15px}
.continue{max-width:1280px;margin:0 0 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.continue span{font-size:13px;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;max-width:320px}
.chip em{font-style:normal;color:var(--muted);font-size:12px}
.chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:24px;max-width:1280px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden;transition:border-color .15s ease,transform .15s ease}
.card:hover{border-color:var(--muted)}
.card.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}25%{box-shadow:0 0 0 3px var(--accent)}}
.cover{position:relative;display:block;width:100%;aspect-ratio:16/10;border:0;padding:0;margin:0;background:var(--bg);cursor:pointer;overflow:hidden}
.cover svg,.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.card-body{display:flex;flex-direction:column;flex:1;padding:14px 16px 10px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.books{color:var(--c-books)} .tag.tools{color:var(--c-tools)} .tag.notes{color:var(--c-notes)} .tag.featured{color:var(--c-featured)} .tag.other{color:var(--c-other)}
.star-badge{color:var(--c-featured);font-weight:600}
.card-title{font-family:var(--serif);font-weight:600;font-size:18.5px;line-height:1.4;margin:0 0 6px}
.card-title a{text-decoration:none}
.card-title a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.sum{margin:0 0 10px;font-size:14.5px;line-height:1.75;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:6px}
.card-foot .acts{margin-left:auto;display:flex;gap:2px}
.card-foot .ibtn{width:36px;height:36px;color:var(--ink);opacity:.7}
.card-foot .ibtn:hover{opacity:1;background:var(--bg)}
.card-foot .icon{width:20px;height:20px;stroke-width:2}
.ibtn[aria-pressed="true"]{color:var(--c-featured);opacity:1}
.ibtn[aria-pressed="true"] .icon{fill:currentColor}
.card-foot .ibtn.is-done{color:var(--accent);opacity:1}                  /* the globe of what is in the public directory already: same place, green, says so when pressed */

.grid.list{grid-template-columns:minmax(0,1fr);gap:12px}
.grid.list .card{flex-direction:row}
.grid.list .cover{width:184px;flex:none;aspect-ratio:16/10;align-self:flex-start;margin:14px 0 14px 14px;border-radius:6px}
.grid.list .sum{-webkit-line-clamp:2}
@media (max-width:640px){.grid.list .cover{width:96px;margin:12px 0 12px 12px}.grid.list .sum{display:none}}

.empty{max-width:760px;padding:28px 0}
.empty h2{font-family:var(--serif);font-size:24px;margin:0 0 8px}
.empty ol{padding-left:1.3em;margin:10px 0 18px}
.empty li{margin:.5em 0}
.empty code{font-family:var(--mono);font-size:13.5px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:1px 6px}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}

.reader-prog{height:2px;background:transparent}
.reader-prog span{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
.reader iframe{flex:1;width:100%;border:0;background:#fff}

/* ---------- add dialog ---------- */
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,18,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 42px)}
.dlg-head{padding:18px 22px 6px}
.dlg-head h2{font-family:var(--serif);font-size:22px;margin:0}
.dlg-body{padding:8px 22px 6px;overflow-y:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--rule)}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--rule);border-radius:8px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);background:var(--bg)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--ink)}
.dlg label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.dlg select,.dlg input[type=text],.dlg textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:7px 9px}
.dlg textarea{min-height:64px;resize:vertical;line-height:1.6}
.pending{border:1px solid var(--rule);border-radius:8px;padding:10px 12px 12px;margin-top:12px}
.pending .fname{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.check{display:flex !important;align-items:center;gap:8px;color:var(--ink) !important;font-size:14px !important;margin:0 0 8px !important}
.target{font-size:13px;color:var(--muted);margin:14px 0 4px;line-height:1.6}

.drop-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,14,18,.55);color:#fff;font-size:20px;font-weight:600;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:9px 10px 9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s ease;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 12px;font-weight:600;cursor:pointer}
.toast button:empty{display:none}

/* ---------- narrow screens ---------- */
@media (max-width:980px){
  .app{display:block}
  .side{display:none;position:fixed;top:0;left:0;bottom:0;z-index:20;width:min(320px,86vw);height:auto;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 0 100vmax rgba(10,14,18,.4)}
  body.drawer .side{display:flex}
  .side-close{display:inline-flex}
  .menu-btn{display:inline-flex}
  .toolbar .lbl{display:none}
  .search kbd{display:none}
}
@media (max-width:620px){
  .top{flex-wrap:wrap;gap:8px}
  .toolbar{display:contents}
  .search{order:1;flex:1 1 calc(100% - 152px);max-width:none}
  #subBtn,#addBtn{order:2;padding:6px 10px}
  #langFilter{order:3}
  #sort{order:4;flex:1;min-width:0}
  #viewBtn{order:5}
  .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .view-head{padding-top:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- v2 additions ---------- */
#viewBtn .icon{width:20px;height:20px;stroke-width:2}
.cat-sep{height:1px;background:var(--rule);margin:8px 10px}
.cat-btn.muted{color:var(--muted)}
.cat-btn .cicon{width:9px;height:9px;flex:none}
.cover .ftype{position:absolute;top:10px;right:10px;font:700 11px/1 var(--mono);letter-spacing:.06em;color:#1A2229;background:rgba(255,255,255,.88);border-radius:4px;padding:5px 7px}
.is-hidden .cover{filter:grayscale(.85);opacity:.6}
.restore-btn{margin-left:auto}
.where{border:1px solid var(--rule);border-radius:999px;padding:0 8px;font-size:12px;line-height:1.7;color:var(--muted)}
.is-hidden .card-foot{flex-wrap:wrap}
.is-hidden .card-foot > span:first-child{flex-basis:100%}
.is-hidden .restore-btn{margin-left:0}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--surface)}
.card-foot .btn{padding:4px 10px;font-size:13px}
#subDlg{width:min(440px,calc(100vw - 24px))}
.sub-hint{margin:0 0 12px;font-size:14px;line-height:1.7;color:var(--muted)}
.sub-list{display:flex;flex-direction:column;gap:8px;margin:0 0 8px}
.sub-list .btn{width:100%;justify-content:center;padding:9px 12px}
.sub-url{margin:2px 0 0;font-size:12.5px;color:var(--muted);word-break:break-all}
#moveDlg{width:min(360px,calc(100vw - 24px))}
.move-list{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.move-list .btn{width:100%;justify-content:flex-start;padding:9px 12px}
.move-list .btn[disabled]{opacity:.5;cursor:default}
.move-list .dot{width:9px;height:9px;border-radius:50%;flex:none}
.reader-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--rule);background:var(--bg)}
.rb-left{display:flex;align-items:center;gap:12px;min-width:0}
.reader-title{min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-center{display:flex;align-items:center;gap:8px;justify-self:center}
.rb-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.rbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:9px;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.rbtn .icon{width:21px;height:21px;stroke-width:2.3}
.rbtn:hover{border-color:var(--ink)}
.rbtn:disabled{opacity:.35;cursor:default;border-color:var(--rule)}
.rbtn.nav{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rbtn.nav:disabled{background:var(--surface);color:var(--muted)}
.rbtn.on{background:var(--c-featured);border-color:var(--c-featured);color:#fff}
.rbtn.on .icon{fill:currentColor}
.pos{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--muted);min-width:58px;text-align:center}
@media (max-width:860px){
  .reader-bar{grid-template-columns:auto 1fr auto;grid-template-areas:"back center right" "title title title";row-gap:6px;padding:8px 10px}
  .rb-left{display:contents}
  .rb-left > .rbtn{grid-area:back}
  .reader-title{grid-area:title;font-size:13.5px;color:var(--muted);text-align:center}
  .rb-center{grid-area:center}
  .rb-right{grid-area:right}
  .rbtn .lbl{display:none}
  .rbtn{padding:0 11px}
  .pos{min-width:44px}
}
.pending .ptype{font-weight:700;margin-right:6px}
.warn{color:var(--c-tools);font-size:13px;margin:6px 0 0}
.pick-row{display:flex;align-items:center;gap:12px;margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.pick-row .btn{flex:none}
</style>
</head>
<body>
<!-- seo:body -->
<!-- /seo:body -->
<div class="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <div class="side-head">
      <div>
        <p class="brand" data-i="brand">个人数字图书馆</p>
        <p class="brand-sub" data-i="brandSub">笔记、读书与工具</p>
        <div class="seg space" id="spaceSwitch" role="group" aria-label="Space" hidden>
          <button type="button" data-space="mine" aria-pressed="true" data-i="spaceMine">我的书架</button>
          <button type="button" data-space="dir" aria-pressed="false" data-i="spaceDir">公共目录</button>
        </div>
      </div>
      <button class="ibtn side-close" type="button" id="sideClose" data-i-aria="close"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="side-scroll">
      <nav class="cats" id="cats" aria-label="Categories"></nav>
      <div class="tagbox" id="tagbox" hidden></div>
      <p class="dir-label"><span id="dirLabel"></span><span id="dirCount"></span></p>
      <div class="dir" id="dir"></div>
    </div>
    <div class="side-foot">
      <p class="source" id="source"></p>
      <div class="foot-row"><button class="btn" type="button" id="connectBtn" hidden></button><button class="btn" type="button" id="disconnectBtn" hidden data-i="disconnect">断开</button></div>
      <div class="foot-row">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="zh" aria-pressed="true">中文</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="btn" type="button" id="themeBtn"></button>
      </div>
      <p class="legal-links"><a href="about.html" data-i="legalAbout">关于本站</a> · <a href="privacy.html" data-i="legalPrivacy">隐私政策</a> · <a href="terms.html" data-i="legalTerms">使用条款</a></p>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="ibtn menu-btn" type="button" id="menuBtn" data-i-aria="menu"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" data-i-ph="search" placeholder="搜索标题、摘要、关键词">
        <kbd>/</kbd>
      </div>
      <div class="toolbar">
        <div class="seg" role="group" id="langFilter" aria-label="Content language">
          <button type="button" data-lf="all" aria-pressed="true" data-i="lfAll">全部</button>
          <button type="button" data-lf="zh" aria-pressed="false">中</button>
          <button type="button" data-lf="en" aria-pressed="false">EN</button>
        </div>
        <select id="sort" aria-label="Sort">
          <option value="recent" data-i="sortRecent">最近添加</option>
          <option value="read" data-i="sortRead">最近阅读</option>
          <option value="title" data-i="sortTitle">标题</option>
        </select>
        <button class="ibtn" type="button" id="viewBtn"></button>
        <button class="btn sub" type="button" id="subBtn" data-i-aria="subscribe" hidden><svg class="icon" viewBox="0 0 24 24"><path d="M5 11a8 8 0 0 1 8 8M5 4a15 15 0 0 1 15 15"/><circle cx="6" cy="18" r="1.4"/></svg><span class="lbl" data-i="subscribe">订阅</span></button>
        <button class="btn primary" type="button" id="addBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl" id="addLbl">添加</span></button>
      </div>
    </header>

    <section class="view-head">
      <h1 id="viewTitle">全部</h1>
      <p id="viewSub"></p>
    </section>
    <div class="continue" id="continue" hidden></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="more-row" id="moreRow" hidden><button class="btn" type="button" id="moreBtn"></button></div>
  </div>
</div>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle" hidden>
  <div class="reader-bar">
    <div class="rb-left">
      <button class="rbtn" type="button" id="readerBack"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span class="lbl" data-i="back">返回</span></button>
      <div class="reader-title" id="readerTitle"></div>
    </div>
    <div class="rb-center">
      <button class="rbtn nav" type="button" id="readerPrev"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span class="lbl" data-i="prev">上一篇</span></button>
      <span class="pos" id="readerPos"></span>
      <button class="rbtn nav" type="button" id="readerNext"><span class="lbl" data-i="next">下一篇</span><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="rb-right">
      <button class="rbtn" type="button" id="readerStar" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span class="lbl" id="readerStarLbl"></span></button>
      <a class="rbtn" id="readerNew" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span class="lbl" data-i="newTab">新标签打开</span></a>
    </div>
  </div>
  <div class="reader-prog"><span id="readerProg"></span></div>
  <iframe id="frame" title="Reader"></iframe>
</div>

<dialog id="subDlg" aria-labelledby="subTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="subTitle">订阅本站</h2></div>
    <div class="dlg-body">
      <p class="sub-hint" id="subHint"></p>
      <div class="sub-scope" id="subScopeRow" hidden><label for="subScope" data-i="subScope">订阅哪一部分</label><select id="subScope"></select></div>
      <div class="sub-list" id="subList"></div>
    </div>
    <div class="dlg-foot"><button class="btn" type="button" id="subClose" data-i="close">关闭</button></div>
  </div>
</dialog>

<dialog id="submitDlg" aria-labelledby="submitTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="submitTitle">收录一个网址</h2></div>
    <div class="dlg-body">
      <div class="seg" id="submitTabs" role="group" hidden>
        <button type="button" data-stab="url" aria-pressed="true" data-i="stabUrl">网址</button>
        <button type="button" data-stab="post" aria-pressed="false" data-i="stabPost">写文章</button>
      </div>
      <div id="paneUrl">
        <p class="sub-hint" data-i="submitHint"></p>
        <label for="submitUrl" data-i="submitUrl">网址</label>
        <input type="text" id="submitUrl" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://">
        <p class="kind-line" id="submitKind" role="status"></p>
        <details class="how"><summary data-i="gistTitle">没有地方发文章？</summary><ol id="gistSteps"></ol></details>
      </div>
      <div id="panePost" hidden>
        <p class="sub-hint" data-i="postHint"></p>
        <label for="postPick" data-i="postPick">从我的书架里选一篇（Markdown / TXT）</label>
        <select id="postPick"></select>
        <label for="postTitle" data-i="postTitleLbl">标题</label>
        <input type="text" id="postTitle" maxlength="120" autocomplete="off">
        <label for="postAuthor" data-i="postAuthorLbl">作者（可选，可以用笔名）</label>
        <input type="text" id="postAuthor" maxlength="40" autocomplete="off">
        <label for="postTags" data-i="postTagsLbl">标签（可选，逗号分隔，最多 5 个）</label>
        <input type="text" id="postTags" autocomplete="off">
        <label for="postBody" data-i="postBodyLbl">正文（Markdown）</label>
        <textarea id="postBody" rows="9" spellcheck="false"></textarea>
        <p class="counter" id="postCount"></p>
      </div>
      <div class="check-card" id="submitCheck" hidden></div>
      <input type="text" id="submitHp" class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="check" id="rightsRow" style="margin-top:14px !important"><input type="checkbox" id="submitRights"><span id="submitRightsText"></span></label>
      <p class="warn" id="submitWarn" hidden></p>
      <p class="result-line" id="submitResult" role="status"></p>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="submitCancel" data-i="cancel">取消</button>
      <button class="btn primary" type="button" id="submitGo" disabled></button>
    </div>
  </div>
</dialog>

<dialog id="moveDlg" aria-labelledby="moveTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="moveTitle"></h2></div>
    <div class="dlg-body"><div class="move-list" id="moveList"></div></div>
    <div class="dlg-foot"><button class="btn" type="button" id="moveCancel" data-i="cancel">取消</button></div>
  </div>
</dialog>

<dialog id="addDlg" aria-labelledby="addTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="addTitle" data-i="addTitle">添加文件</h2></div>
    <div class="dlg-body">
      <div class="dropzone" id="dropzone" role="button" tabindex="0">
        <svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        <span data-i="dropHint">拖入或点击选择文件</span>
      </div>
      <input type="file" id="fileInput" accept=".html,.htm,.md,.markdown,.txt,.pdf,text/html,text/markdown,text/plain,application/pdf" multiple hidden>
      <div class="pick-row">
        <button class="btn" type="button" id="pickFolder"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg><span data-i="addFolder">选择项目文件夹</span></button>
        <span data-i="folderHint">网页工具由多个文件组成时，选择（或直接拖入）整个文件夹，文件夹里需要有 index.html</span>
      </div>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
      <div id="pendingList"></div>
      <p class="warn" id="addMsg" role="status" hidden></p>
      <div class="row2">
        <div>
          <label for="addCat" data-i="category">分类</label>
          <select id="addCat"></select>
        </div>
        <label class="check"><input type="checkbox" id="addFeat"><span data-i="markFeatured">同时设为精选</span></label>
      </div>
      <p class="target" id="addTarget"></p>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="addCancel" data-i="cancel">取消</button>
      <button class="btn primary" type="button" id="addSave" data-i="save" disabled>保存</button>
    </div>
  </div>
</dialog>

<div class="drop-overlay" id="dropOverlay" hidden><span data-i="dropRelease">松开即可添加</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct"></button></div>

  get(k,d){ try{ const v=localStorage.getItem('archive.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('archive.'+k, JSON.stringify(v)); }catch(e){} }
};
/* Things that belong to this visitor and never leave the browser:
   'local' = files they added here, 'kv' = the local folder they connected (a folder handle can only live in IndexedDB) */
const idb = (function(){
  let p=null;
  function open(){
    if(p) return p;
    p = new Promise((res,rej)=>{
      if(!('indexedDB' in window)) return rej(new Error('no idb'));
      const r=indexedDB.open('my-archive',2);
      r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('local')) d.createObjectStore('local',{keyPath:'id'}); if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    return p;
  }
  function run(store,mode,fn){
    return open().then(d=>new Promise((res,rej)=>{
      const t=d.transaction(store,mode), req=fn(t.objectStore(store));
      t.oncomplete=()=>res(req?req.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
    }));
  }
  return {
    all:()=>run('local','readonly',s=>s.getAll()).catch(()=>[]),
    put:v=>run('local','readwrite',s=>s.put(v)),
    del:k=>run('local','readwrite',s=>s.delete(k)),
    get:k=>run('kv','readonly',s=>s.get(k)).catch(()=>undefined),
    set:(k,v)=>run('kv','readwrite',s=>s.put(v,k)).catch(()=>undefined)
  };
})();

const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } };
/* the same page by another spelling (http / https, www, a trailing slash, index.html, tracking parameters) has the same key; mirrors url_key() of the directory's aggregator */
const TRACK = /^(utm_.*|fbclid|gclid|dclid|msclkid|mc_cid|mc_eid|igshid|spm|share_token|xtor|_hsenc|_hsmi|yclid|ref_src|vero_id|oly_enc_id|oly_anon_id)$/i;
function urlKey(u){
  try{
    const p=new URL(u); let host=p.hostname.toLowerCase().replace(/^www\./,''), path;
    try{ path=decodeURIComponent(p.pathname); }catch(e){ path=p.pathname; }
    path=path.replace(/\/{2,}/g,'/').replace(/\/index\.(html?|php)$/,'').replace(/\/+$/,'');
    let q=[...p.searchParams.entries()].filter(([k])=>!TRACK.test(k)).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:a[1]<b[1]?-1:a[1]>b[1]?1:0);
    const seg=path.split('/').filter(Boolean);
    if(host==='m.youtube.com') host='youtube.com';
    if(host==='youtu.be' && seg.length){ host='youtube.com'; path='/watch'; q=[['v',seg[0]]]; }
    else if(host==='youtube.com'){ if((seg[0]==='shorts'||seg[0]==='embed') && seg.length>1){ path='/watch'; q=[['v',seg[1]]]; } else if(path==='/watch') q=q.filter(([k])=>k==='v'); }
    else if(host==='github.com') path=path.replace(/\.git$/,'').toLowerCase();
    return host+path+(q.length?'?'+q.map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):'');
  }catch(e){ return String(u).toLowerCase(); }
}
const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';
const today = ts => { const d=new Date(ts||Date.now()); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function toast(msg, actLabel, fn){
  const el=$('#toast'), b=$('#toastAct');
  $('#toastMsg').textContent=msg; b.textContent=actLabel||''; b.onclick = fn ? ()=>{ el.classList.remove('show'); fn(); } : null;
  el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), fn?6000:2800);
}

/* ================= metadata extraction (browser side) ================= */
const clean = s => String(s||'').replace(/\s+/g,' ').trim();
const cut = (s,n) => { s=clean(s); return s.length>n? s.slice(0,n).trim()+'…' : s; };
function textStats(text){
  const cjk=(text.match(/[\u4e00-\u9fff]/g)||[]).length, words=(text.match(/[A-Za-z]+/g)||[]).length;
  let lang = cjk>=words?'zh':'en'; if(cjk>200 && words>600) lang='mixed';
  return {lang, minutes:Math.max(1, Math.round(cjk/400 + words/220))};
}
function metaHTML(html, filename){
  const doc = new DOMParser().parseFromString(html,'text/html');
  const meta = n => { const el=doc.querySelector(`meta[name="${n}"],meta[property="${n}"]`); return el?(el.getAttribute('content')||'').trim():''; };
  let lead='', firstP='';
  doc.querySelectorAll('p').forEach(p=>{ const x=clean(p.textContent); if(!lead && p.classList.contains('lead') && x.length>=12) lead=x; if(!firstP && x.length>=30) firstP=x; });
  const h1 = doc.querySelector('h1') ? clean(doc.querySelector('h1').textContent) : '';
  doc.querySelectorAll('script,style,noscript,template').forEach(e=>e.remove());
  const st = textStats(clean(doc.body ? doc.body.textContent : ''));
  return {
    title: cut(meta('archive:title') || clean(doc.title) || h1 || filename.replace(/\.[^.]+$/,''),120),
    summary: cut(meta('description') || meta('og:description') || lead || firstP, 220),
    keywords: meta('keywords').split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean), ...st,
    date: meta('archive:date') || (meta('article:published_time')||'').slice(0,10), cover: meta('archive:cover') || '',
    featured: /^(true|1|yes)$/i.test(meta('archive:featured')), metaCategory: meta('archive:category')
  };
}
function frontMatter(text){
  const m = text.match(/^\ufeff?---\s*\n([\s\S]*?)\n---\s*(\n|$)/); const fm={};
  if(!m) return {fm, body:text};
  m[1].split('\n').forEach(line=>{ const i=line.indexOf(':'); if(i>0 && !/^[\s-]/.test(line)){ let v=line.slice(i+1).trim().replace(/^["']|["']$/g,''); if(/^\[.*\]$/.test(v)) v=v.slice(1,-1).split(',').map(x=>x.trim().replace(/^["']|["']$/g,'')).filter(Boolean); fm[line.slice(0,i).trim().toLowerCase()]=v; } });
  return {fm, body:text.slice(m[0].length)};
}
const stripMd = s => clean(String(s).replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[*_`~]+/g,'').replace(/<[^>]+>/g,''));
function metaText(text, filename, isTxt){
  const {fm, body} = isTxt ? {fm:{}, body:text} : frontMatter(text);
  let title='', summary='', inCode=false, para=[];
  for(const line of body.split('\n')){
    const l=line.trim();
    if(/^(```|~~~)/.test(l)){ inCode=!inCode; continue; } if(inCode) continue;
    if(!title){ if(isTxt && l){ title=l.slice(0,120); continue; } const h=l.match(/^#\s+(.+)/); if(h){ title=stripMd(h[1]); continue; } }
    if(!summary){
      if(l && !/^(#{1,6}\s|[-*+]\s|\d+\.\s|>|\||!\[|<)/.test(l)) para.push(l);
      else if(para.length){ summary=stripMd(para.join(' ')); para=[]; }
      if(para.join(' ').length>260) summary=stripMd(para.join(' '));
    }
  }
  if(!summary && para.length) summary=stripMd(para.join(' '));
  let kw = fm.tags || fm.keywords || []; if(typeof kw==='string') kw=kw.split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean);
  return { title:cut(fm.title||title||filename.replace(/\.[^.]+$/,''),120), summary:cut(fm.description||fm.summary||summary,220), keywords:kw,
    ...textStats(stripMd(body)), date:String(fm.date||'').slice(0,10), cover:fm.cover||'', featured:/^(true|1|yes)$/i.test(String(fm.featured||'')), metaCategory:fm.category||'' };
}
function latin1(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return s; }
function pdfString(raw){
  raw=raw.trim();
  if(raw.startsWith('<')){ const hex=raw.slice(1,-1).replace(/\s/g,''); const b=[]; for(let i=0;i<hex.length;i+=2) b.push(parseInt(hex.substr(i,2),16)); return decodeBytes(b); }
  if(raw.startsWith('(')){ const s=raw.slice(1,-1).replace(/\\([()\\])/g,'$1'); const b=Array.from(s,c=>c.charCodeAt(0)&255); return decodeBytes(b); }
  return '';
}
function decodeBytes(b){
  if(b[0]===0xFE && b[1]===0xFF){ let s=''; for(let i=2;i+1<b.length;i+=2) s+=String.fromCharCode((b[i]<<8)|b[i+1]); return s; }
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(b)); }catch(e){ return String.fromCharCode.apply(null,b); }
}
async function metaPDF(file){
  const out = {title:file.name.replace(/\.pdf$/i,''), summary:'', keywords:[], lang:/[\u4e00-\u9fff]/.test(file.name)?'zh':'en', minutes:null, pages:null, date:'', cover:'', featured:false, metaCategory:''};
  if(file.size > 40*1048576) return out;
  try{
    const bytes = new Uint8Array(await file.arrayBuffer()); const s = latin1(bytes);
    let title='';
    const x = s.match(/<dc:title>[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>/);
    if(x) title = decodeBytes(Array.from(x[1],c=>c.charCodeAt(0)&255));
    if(!title){ const m=s.match(/\/Title\s*(\((?:\\.|[^\\)])*\)|<[0-9A-Fa-f\s]*>)/); if(m) title=pdfString(m[1]); }
    let pages=0; for(const m of s.matchAll(/\/Type\s*\/Pages\b[^>]*?\/Count\s+(\d+)/g)) pages=Math.max(pages,+m[1]);
    for(const m of s.matchAll(/\/Count\s+(\d+)[^>]*?\/Type\s*\/Pages\b/g)) pages=Math.max(pages,+m[1]);
    if(!pages) pages=(s.match(/\/Type\s*\/Page\b/g)||[]).length;
    if(clean(title)) out.title=cut(title,120);
    out.pages=pages||null; out.lang=/[\u4e00-\u9fff]/.test(out.title)?'zh':'en';
  }catch(e){}
  return out;
}
async function metaFile(file){
  const type = typeOf(file.name);
  if(type==='pdf') return {type, ...(await metaPDF(file))};
  const text = await file.text();
  return {type, ...(type==='html' ? metaHTML(text,file.name) : metaText(text,file.name,type==='txt'))};
}

/* ================= data sources ================= */
async function loadServer(){
  try{
    const r = await fetch('api/list',{cache:'no-store'});
    if(!r.ok || !(r.headers.get('content-type')||'').includes('json')) return null;
    const d = await r.json(); state.dirCfg = httpUrl(d.directory); return (d.items||[]).map(x=>({type:'html',...x, source:'server'}));
  }catch(e){ return null; }
}
async function loadStatic(){
  let m = window.ARCHIVE_MANIFEST;
  if(!m){ try{ const r=await fetch('manifest.json',{cache:'no-store'}); if(r.ok) m=await r.json(); }catch(e){} }
  if(!m || !Array.isArray(m.items)) return null;
  state.generated = m.generated || ''; state.dirCfg = httpUrl(m.directory);
  return m.items.map(x=>({type:'html',...x, source:'static'}));
}
async function readFolderMeta(dir){ try{ const fh=await dir.getFileHandle('_meta.json'); return JSON.parse(await (await fh.getFile()).text()) || {}; }catch(e){ return {}; } }
async function writeFolderMeta(dir, data){ const fh=await dir.getFileHandle('_meta.json',{create:true}); const w=await fh.createWritable(); await w.write(JSON.stringify(data,null,2)); await w.close(); }
async function scanFolder(dir){
  const out=[], overrides=await readFolderMeta(dir);
  async function addFile(handle, rel, cat){
    const f=await handle.getFile(); const info=await metaFile(f);
    const category = cat || normCat(info.metaCategory || 'notes'); delete info.metaCategory;
    // 'folder:' keeps these ids apart from the server's own items, which can have the same path
    const it = {...info, id:'folder:'+rel, rel, path:'library/'+rel, category, size:f.size, added:Math.floor(f.lastModified/1000), date:info.date||today(f.lastModified), source:'folder', handle};
    const o=overrides[rel]||{}; ['title','summary','featured','hidden','keywords'].forEach(k=>{ if(o[k]!==undefined && o[k]!=='') it[k]=o[k]; });
    out.push(it);
  }
  const ok = n => typeOf(n) && !/^[._]/.test(n);
  for await (const [name,h] of dir.entries()){
    if(/^[._]/.test(name)) continue;
    if(h.kind==='directory'){ const cat=normCat(name); for await (const [n2,h2] of h.entries()){ if(h2.kind==='file' && ok(n2)) await addFile(h2, name+'/'+n2, cat); } }
    else if(ok(name)) await addFile(h, name, null);
  }
  return out;
}
/* What is shown is three lists side by side, none replacing another:
   1. the site's own list: serve.py live (mode 'server'), or the deployed manifest (mode 'static')
   2. the visitor's own local folder, if they connected one
   3. files the visitor added in this browser */
async function loadAll(){
  let primary = await loadServer(); state.mode = primary ? 'server' : 'none';
  if(!primary){ primary=await loadStatic(); if(primary) state.mode='static'; }
  let folder=[]; if(state.dir && state.mode!=='server'){ try{ folder=await scanFolder(state.dir); }catch(e){ state.dir=null; } }
  const local = (await idb.all()).map(x=>({type:'html',...x, source:'local'}));
  state.items = (primary||[]).concat(folder, local); state.loaded=true; render();
}
/* Where "Add" writes: the site's own library when running serve.py; otherwise the visitor's connected folder, or else this browser. Never a deployed server. */
const addMode = () => state.mode==='server' ? 'server' : state.dir ? 'folder' : 'local';

/* ================= flags: featured / hidden ================= */
function flag(it, k){
  if(it.source==='static' && state.flags[it.id] && state.flags[it.id][k]!==undefined) return !!state.flags[it.id][k];
  return !!it[k];
}
const isHidden = it => flag(it,'hidden');
const isFeatured = it => it.category==='featured' || flag(it,'featured');
async function setFlag(id, k, v){
  const it = state.items.find(x=>x.id===id); if(!it) return false;
  try{
    if(it.source==='server'){
      const r=await fetch('api/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,[k]:v})}); if(!r.ok) throw new Error(r.status);
    } else if(it.source==='folder' && state.dir){
      const m=await readFolderMeta(state.dir); m[it.rel]={...(m[it.rel]||{}),[k]:v}; await writeFolderMeta(state.dir,m);
    } else if(it.source==='local'){
      const rec={...it,[k]:v}; delete rec.source; await idb.put(rec);
    } else {
      state.flags[id]={...(state.flags[id]||{}),[k]:v}; LS.set('flags',state.flags);
      if(!LS.get('staticHint',false)){ LS.set('staticHint',true); setTimeout(()=>toast(t('staticNote')),3000); }
    }
    it[k]=v; return true;
  }catch(e){ toast(t('saveFail')+e.message); return false; }
}
async function toggleStar(id){
  const it=state.items.find(x=>x.id===id); if(!it) return;
  if(it.category==='featured'){ toast(t('featuredFolder')); return; }
  if(await setFlag(id,'featured',!isFeatured(it))){ render(); syncReader(); }
}
async function hideItem(id){
  const it=state.items.find(x=>x.id===id); if(!it) return;
  if(await setFlag(id,'hidden',true)){ render(); toast(t('hiddenToast',cut(it.title,24)), t('undo'), async()=>{ if(await setFlag(id,'hidden',false)) render(); }); }
}
async function restoreItem(id){
  const it=state.items.find(x=>x.id===id); if(!it) return;
  if(await setFlag(id,'hidden',false)){ render(); toast(t('restoredToast',cut(it.title,24))); }
}

/* ================= covers ================= */
function hashStr(s){ let h=2166136261>>>0; for(const ch of String(s)){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let x=a; x=Math.imul(x^(x>>>15),x|1); x^=x+Math.imul(x^(x>>>7),x|61); return ((x^(x>>>14))>>>0)/4294967296; }; }
const PALETTES = [
  ['#E4E9F2','#8FA3C7','#24365C'], ['#DDEFEB','#6FB8AB','#1F5F55'], ['#F4EAD2','#D6A63A','#6B4A06'],
  ['#ECE3EA','#B08AA6','#4E3550'], ['#E2E8DC','#93A98B','#2F4430'], ['#E9E7E1','#A9A49A','#34322E'],
  ['#E3EDF3','#7FA7BE','#1F4257'], ['#F1E4DF','#C49A8C','#5A3328']
];
function glyphOf(title){
  let s=String(title||'').replace(/^(读书笔记|笔记|notes?)\s*[｜|:：\-—]\s*/i,'').replace(/^[\s《「『“"'(（\[【]+/,'');
  const ch=Array.from(s)[0]||'#'; return /[a-z]/i.test(ch)?ch.toUpperCase():ch;
}
function coverSVG(it){
  const r=rng(hashStr(it.id)+(state.seeds[it.id]||0)*7919);
  const [bg,mid,ink]=PALETTES[Math.floor(r()*PALETTES.length)];
  const W=320,H=200,kind=Math.floor(r()*5); let g='';
  if(kind===0){ const cx=r()<.5?0:W, cy=r()<.5?0:H; for(let i=1;i<=10;i++){ const s=i%3===0; g+=`<circle cx="${cx}" cy="${cy}" r="${i*27}" fill="none" stroke="${s?ink:mid}" stroke-opacity="${s?.4:.6}" stroke-width="${s?3:1.4}"/>`; } }
  else if(kind===1){ let x=-H,s=''; while(x<W+H){ const w=8+r()*34; s+=`<rect x="${x.toFixed(1)}" y="-80" width="${w.toFixed(1)}" height="${H+160}" fill="${r()<.22?ink:mid}" opacity="${(.22+r()*.45).toFixed(2)}"/>`; x+=w+6+r()*26; } g=`<g transform="rotate(${(-35+r()*70).toFixed(1)} ${W/2} ${H/2})">${s}</g>`; }
  else if(kind===2){ const st=16+Math.floor(r()*10); for(let y=st/2;y<H;y+=st) for(let x=st/2;x<W;x+=st){ const v=r(); if(v<.6) g+=`<circle cx="${x}" cy="${y}" r="${(1.4+v*6).toFixed(1)}" fill="${v<.1?ink:mid}" opacity="${v<.1?.75:.5}"/>`; } }
  else if(kind===3){ let x=10; const base=H-22; while(x<W-8){ const w=9+r()*22, h=50+r()*112; g+=`<rect x="${x.toFixed(1)}" y="${(base-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${r()<.3?ink:mid}" opacity="${(.35+r()*.5).toFixed(2)}"/>`; x+=w+3+r()*6; } g+=`<rect x="0" y="${base}" width="${W}" height="3" fill="${ink}" opacity=".5"/>`; }
  else { for(let i=0;i<9;i++){ const y0=16+i*22,a=5+r()*14,f=1+r()*2.5,ph=r()*6; let d=`M0 ${y0}`; for(let x=8;x<=W;x+=8) d+=` L${x} ${(y0+Math.sin(x/W*Math.PI*2*f+ph)*a).toFixed(1)}`; g+=`<path d="${d}" fill="none" stroke="${i%4===0?ink:mid}" stroke-width="${i%4===0?2.6:1.5}" opacity=".65"/>`; } }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="${bg}"/>${g}<rect x="16" y="${H-94}" width="78" height="78" rx="4" fill="${bg}" opacity=".9"/><text x="55" y="${H-36}" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-weight="900" font-size="50" fill="${ink}">${esc(glyphOf(it.title))}</text></svg>`;
}
function coverHTML(it, noImg){
  let inner;
  if(!noImg && it.cover && (it.source==='server'||it.source==='static')){
    const src=/^(https?:|data:|\/)/.test(it.cover)?it.cover:encPath(it.path.replace(/[^/]*$/,'')+it.cover);
    inner=`<img src="${esc(src)}" alt="" loading="lazy">`;
  } else if(!noImg && it.type==='link' && it.image && it.image.startsWith('https://')){
    inner=`<img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fb="1">`;      // someone else's picture: no referrer, and the generated cover if it fails to load
  } else inner=coverSVG(it);
  const tag = it.project ? 'APP' : (it.type && it.type!=='html' ? it.type.toUpperCase() : '');
  return inner + (tag ? `<span class="ftype">${tag}</span>` : '');
}

/* ================= filtering & render ================= */
const tokens = () => state.q.toLowerCase().split(/\s+/).filter(Boolean);
function matches(it, tk){
  if(state.lf!=='all'){ if(state.lf==='zh' && it.lang==='en') return false; if(state.lf==='en' && it.lang==='zh') return false; }
  if(state.tag && !(it.keywords||[]).some(k=>String(k).toLowerCase()===state.tag.toLowerCase())) return false;
  if(!tk.length) return true;
  const hay=[it.title,it.summary,(it.keywords||[]).join(' '),it.id,catName(it.category),it.type].join(' ').toLowerCase();
  return tk.every(x=>hay.includes(x));
}
function inCat(it, cat){
  if(cat==='hidden') return isHidden(it);
  if(isHidden(it)) return false;
  return cat==='all' || (cat==='featured' ? isFeatured(it) : it.category===cat);
}
function sorted(list){
  const a=list.slice(), loc=state.lang==='zh'?'zh-Hans-CN':'en';
  if(state.sort==='title') a.sort((x,y)=>x.title.localeCompare(y.title,loc));
  else if(state.sort==='read') a.sort((x,y)=>(state.lastRead[y.id]||0)-(state.lastRead[x.id]||0) || (y.added||0)-(x.added||0));
  else a.sort((x,y)=>(y.added||0)-(x.added||0));
  return a;
}
function hl(text, tk){
  let s=esc(text); if(!tk.length) return s;
  const parts=tk.map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).filter(Boolean);
  return parts.length ? s.replace(new RegExp('('+parts.join('|')+')','gi'),'<mark>$1</mark>') : s;
}
function allCats(){
  const extra=[]; state.items.forEach(it=>{ if(!BASE_CATS.includes(it.category) && !extra.includes(it.category)) extra.push(it.category); });
  return ['all','featured'].concat(CAT_ORDER, extra.sort());
}

/* The real, shareable address of an item (search engines ignore everything after "#", so "#read/…" is never it):

  const star=isFeatured(it), prog=Math.round((state.progress[it.id]||{}).pct||0), href=directHref(it), isLink=it.type==='link';
  const lang = it.lang==='en'?t('langEn'):(it.lang==='mixed'?t('langMixed'):t('langZh'));
  const ib = (act,icon,label,pressed) => `<button class="ibtn" type="button" data-act="${act}"${pressed!==undefined?` aria-pressed="${pressed}"`:''} title="${esc(label)}" aria-label="${esc(label)}">${icon}</button>`;
  const sizeInfo = isLink ? hostOf(it.url) : it.project ? t('projInfo',it.files||1,fmtSize(it.size||0))
    : it.type==='pdf' ? [it.pages?t('pages',it.pages):'', it.size?fmtSize(it.size):''].filter(Boolean).join('，') : t('minutes',it.minutes||1);
  // moving / deleting only for what the visitor owns: the library served by serve.py, or files added in this browser
  const manage = it.source==='server' || it.source==='local';

  const ext = isLink ? ' target="_blank" rel="noopener noreferrer"' : '';
  // the public directory: is this one in it (a deployed page whose address the directory lists), does the owner keep it out, is it a copy of another file
  const inDir = !!(state.dirKeys && ((it.source==='static' && href && state.dirKeys.has(urlKey(new URL(href,location.href).href))) || (isLink && state.dirKeys.has(urlKey(it.url)))));
  const same = it.same ? state.items.find(x=>x.id===it.same) : null;

  const pubKind = publishKind(it);
  const listedPost = pubKind==='post' && !!state.dirData && state.dirData.items.some(i=>i.shelf==='posts' && i.title===it.title);
  const listed = inDir || listedPost;
  const canPublish = !!pubKind && !listed;

  return `<article class="card${hiddenView?' is-hidden':''}" data-id="${esc(it.id)}">
    <button class="cover" type="button" data-act="open" aria-label="${esc(it.title)}">${coverHTML(it)}${prog>1?`<span class="prog" style="width:${Math.min(prog,100)}%"></span>`:''}</button>
    <div class="card-body">
      <p class="meta"><span class="tag ${catClass(it.category)}">${esc(catName(it.category))}</span>${where?`<span class="where">${esc(where)}</span>`:''}${badges}${star&&it.category!=='featured'?`<span class="star-badge">★ ${esc(t('featured'))}</span>`:''}<span>${esc(lang)}</span><span>${esc(it.date||'')}</span></p>

function docShell(title, bodyHTML, meta){
  const th = state.theme!=='auto' ? ` data-theme="${state.theme}"` : '';
  return `<!DOCTYPE html><html lang="${state.lang==='zh'?'zh-CN':'en'}"${th}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet"><style>${DOC_CSS}</style></head><body><article class="doc">${meta?`<p class="doc-meta">${esc(meta)}</p>`:''}${bodyHTML}</article></body></html>`;
}
function renderMarkdown(md, it, base){
  const {body} = frontMatter(md);
  if(!window.marked){ toast(t('noRenderer')); return `<h1>${esc(it.title)}</h1><p class="note">${esc(t('noRenderer'))}</p><div class="plain">${esc(body)}</div>`; }
  let html = window.marked.parse(body, {gfm:true});
  if(window.DOMPurify) html = window.DOMPurify.sanitize(html);
  const doc = new DOMParser().parseFromString(`<div id="r">${html}</div>`,'text/html'), root=doc.getElementById('r');
  root.querySelectorAll('img[src],a[href]').forEach(el=>{
    const attr=el.tagName==='IMG'?'src':'href', v=el.getAttribute(attr)||'';
    if(base && v && !/^(#|[a-z][a-z0-9+.-]*:|\/\/)/i.test(v)){ try{ el.setAttribute(attr,new URL(v,base).href); }catch(e){} }
    if(el.tagName==='A' && !/^#/.test(el.getAttribute('href')||'')){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener'); }
  });
  root.querySelectorAll('table').forEach(tb=>{ const w=doc.createElement('div'); w.className='tbl'; tb.replaceWith(w); w.appendChild(tb); });
  const heads=[...root.querySelectorAll('h2,h3')];
  heads.forEach((h,i)=>{ h.id='s'+(i+1); });
  if(!root.querySelector('h1')) root.insertAdjacentHTML('afterbegin',`<h1>${esc(it.title)}</h1>`);
  if(heads.length>=3){
    const toc=heads.map(h=>`<li style="margin-left:${h.tagName==='H3'?'1em':'0'}"><a href="#${h.id}">${esc(h.textContent)}</a></li>`).join('');
    root.querySelector('h1').insertAdjacentHTML('afterend',`<details class="toc" open><summary>${esc(t('toc'))}</summary><ol>${toc}</ol></details>`);

}
async function rawData(it){
  if(it.source==='folder'){ const f=await it.handle.getFile(); return it.type==='pdf' ? f : await f.text(); }
  if(it.source==='local'){ const d = it.data!==undefined ? it.data : it.html; return d; }
  if(location.protocol==='file:') throw new Error(t('needServe'));      // browsers refuse fetch() on local files
  const r=await fetch(encPath(it.path),{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
  return it.type==='pdf' ? await r.blob() : await r.text();
}
function setBlob(content, type){ if(state.blobUrl){ URL.revokeObjectURL(state.blobUrl); } state.blobUrl=URL.createObjectURL(content instanceof Blob ? content : new Blob([content],{type})); return state.blobUrl; }

/* ================= reader ================= */
async function urlFor(it){
  if(state.blobUrl){ URL.revokeObjectURL(state.blobUrl); state.blobUrl=null; }
  const direct = it.source==='server'||it.source==='static';
  if((it.type==='html'||it.type==='pdf') && direct) return encPath(it.path);
  const data = await rawData(it);
  if(it.type==='pdf') return setBlob(data instanceof Blob ? new Blob([data],{type:'application/pdf'}) : data, 'application/pdf');
  if(it.type==='html') return setBlob(String(data||''), 'text/html;charset=utf-8');
  const base = direct ? new URL(it.path.replace(/[^/]*$/,''), location.href).href : '';
  const meta = [it.date, t('minutes',it.minutes||1)].filter(Boolean).join('，');
  const body = it.type==='md' ? renderMarkdown(String(data||''), it, base) : `<h1>${esc(it.title)}</h1><div class="plain">${esc(String(data||''))}</div>`;
  return setBlob(docShell(it.title, body, meta), 'text/html;charset=utf-8');
}
function syncReader(){
  if(!state.readingId) return; const it=state.items.find(x=>x.id===state.readingId); if(!it) return;
  const on=isFeatured(it), b=$('#readerStar');
  b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));
  $('#readerStarLbl').textContent = on?t('unstar'):t('star'); b.title = on?t('unstarTip'):t('starTip'); b.setAttribute('aria-label',b.title);
  const idx=state.visible.indexOf(state.readingId), n=state.visible.length;
  $('#readerPrev').disabled = idx<=0; $('#readerNext').disabled = idx<0 || idx>=n-1;
  $('#readerPos').textContent = idx>=0 ? `${idx+1} / ${n}` : '';
}
async function openReader(id, push){
  const it=state.items.find(x=>x.id===id); if(!it) return;
  if(it.type==='link'){ if(httpUrl(it.url)) window.open(it.url,'_blank','noopener,noreferrer'); return; }       // a saved link: the original site, not the reader
  let url; try{ url=await urlFor(it); }catch(e){ toast(t('openFail')+(e.message==='404'?t('notFound'):e.message)); return; }
  state.readingId=id;
  $('#readerTitle').textContent=it.title; $('#readerProg').style.width='0%';
  $('#readerNew').href = directHref(it) || url;
  syncReader();
  $('#reader').hidden=false; document.body.classList.add('reading');
  const fr=$('#frame');
  const touch = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
  if(it.type==='pdf' && (touch || navigator.pdfViewerEnabled===false)){
    // phones, or a desktop browser whose built-in PDF viewer is off: an iframe would stay blank or start a download
    const abs=new URL(url,location.href).href, info=[it.pages?t('pages',it.pages):'', it.size?fmtSize(it.size):''].filter(Boolean).join('，');
    fr.removeAttribute('src');
    fr.srcdoc=docShell(it.title, `<h1>${esc(it.title)}</h1><p>${esc(t(touch?'pdfMobile':'pdfNoViewer'))}</p><p><a class="open-pdf" href="${esc(abs)}" target="_blank" rel="noopener">${esc(t('openPdf'))}</a><a class="open-pdf alt" href="${esc(abs)}" download>${esc(t('download'))}</a></p>`, info);

async function takeFiles(files){
  const limit = addMode()==='server'?LIMIT_SERVER_MB:addMode()==='folder'?Infinity:LIMIT_LOCAL_MB;
  for(const f of Array.from(files||[])){
    if(!typeOf(f.name)){ note(t('unsupported',f.name)); continue; }
    if(f.size>limit*1048576){ note(t('tooBig',f.name,limit)); continue; }

/* A folder with an index.html is a project: one card, uploaded as a whole. Without one, its documents are added one by one. */
const IGNORED_NAME = s => /^\./.test(s) || s==='node_modules' || s==='__MACOSX' || /^(thumbs\.db|desktop\.ini)$/i.test(s);
async function takeFolder(name, list){            // list: [{path relative to the folder, file}]
  list = list.filter(x=>!x.path.split('/').some(IGNORED_NAME));
  if(!list.length){ note(t('folderEmpty',name)); return; }
  const entry = list.find(x=>/^index\.html?$/i.test(x.path));
  if(entry){
    if(state.mode!=='server'){ note(t('projNeedsServer')); return; }
    const big = list.find(x=>x.file.size>LIMIT_SERVER_MB*1048576);
    if(big){ note(t('folderTooBig',big.path,LIMIT_SERVER_MB)); return; }
    const m = metaHTML(await entry.file.text(), name+'.html');     // folder name is the title when index.html has none
    state.pending.push({kind:'project', name, entry:entry.path, files:list, type:'html', size:list.reduce((s,x)=>s+x.file.size,0), ...m});
  } else {
    const docs = list.filter(x=>typeOf(x.file.name));
    if(!docs.length){ note(t('folderEmpty',name)); return; }
    await takeFiles(docs.map(x=>x.file)); note(t('folderNoIndex',name));
  }
  renderPending();
}
/* Dropped folders must be grabbed synchronously inside the drop event; reading them can happen later. */
function grabDrop(dt){
  const entries = Array.from((dt&&dt.items)||[]).filter(i=>i.kind==='file').map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null);
  return entries.length && entries.every(Boolean) ? {entries} : {files:Array.from((dt&&dt.files)||[])};
}
const readAllEntries = dir => new Promise((res,rej)=>{ const r=dir.createReader(), out=[]; (function next(){ r.readEntries(b=>{ if(!b.length) res(out); else{ out.push(...b); next(); } },rej); })(); });

async function walkEntry(e, prefix, out){
  if(e.isFile) out.push({path:prefix+e.name, file:await entryFile(e)});
  else if(e.isDirectory) for(const c of await readAllEntries(e)) await walkEntry(c, prefix+e.name+'/', out);
}
async function takeDropped(g){
  try{
    if(g.files){ await takeFiles(g.files); return; }
    for(const e of g.entries){
      if(e.isFile){ await takeFiles([await entryFile(e)]); continue; }
      const list=[]; await walkEntry(e,'',list);
      await takeFolder(e.name, list.map(x=>({path:x.path.split('/').slice(1).join('/'), file:x.file})));   // drop the folder's own name
    }
  }catch(err){ note(t('saveFail')+err.message); }
}

/* project folder -> server: reserve the folder, send the files one by one (index.html last), then finish; on failure remove the half-written folder */
async function uploadProject(p, cat, feat){
  const post = async (route, params, body) => {
    const r=await fetch(route+'?'+new URLSearchParams(params).toString(),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||r.status); return d;
  };
  const {dir} = await post('api/project/begin',{category:cat,name:p.name});
  try{
    const files=p.files.slice().sort((a,b)=>(a.path===p.entry)-(b.path===p.entry));
    for(let i=0;i<files.length;i++){ note(t('uploading',i+1,files.length)); await post('api/project/file',{dir,path:files[i].path},files[i].file); }
    await post('api/project/finish',{dir,title:p.title||'',summary:p.summary||'',featured:feat?'1':''});
  }catch(e){ await post('api/project/abort',{dir}).catch(()=>{}); throw e; }
}
async function fileHash(file){                                           // SHA-1 of the content, to notice the same file added twice (needs a secure page; else no check)
  try{ const h=await crypto.subtle.digest('SHA-1',await file.arrayBuffer()); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; }
}
$('#addSave').addEventListener('click',async ()=>{

        while(true){ try{ await folder.getFileHandle(fname); fname=`${stem}-${n++}${ext}`; }catch(e){ break; } }
        const fh=await folder.getFileHandle(fname,{create:true}); const w=await fh.createWritable(); await w.write(p.file); await w.close();
        const rel=name+'/'+fname, m=await readFolderMeta(state.dir), entry={};

const DIR_TYPES=['article','note','video','audio','pdf','tool'], DIR_PAGE=60, DIR_SHELVES=12;

    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d || d.spec!==1 || !Array.isArray(d.items)) throw new Error('directory.json');
    d.items=d.items.filter(i=>i && typeof i==='object' && i.id && httpUrl(i.url)).map(i=>({...i, id:String(i.id), title:String(i.title||i.url), summary:String(i.summary||''), url:httpUrl(i.url),

      type:DIR_TYPES.includes(i.type)?i.type:'article', tags:Array.isArray(i.tags)?i.tags.map(String):[]}));
    d.shelves=(Array.isArray(d.shelves)?d.shelves:[]).filter(s=>s && s.id).map(s=>({...s, id:String(s.id), name:String(s.name||s.id), home:httpUrl(s.home), description:String(s.description||''), kind:String(s.kind||''), n:+s.n||0}));

    state.shelfMap=new Map(d.shelves.map(s=>[s.id,s])); state.dirData=d; state.dirState='ok'; state.dirKeys=new Set(d.items.map(i=>urlKey(i.url)));

   'post' a Markdown / TXT article that only exists in my space (this browser, a folder, serve.py): its text, hosted by the directory once approved;

const submitDlg=$('#submitDlg'), RIGHTS_OPTION='我有权发布这些内容 / I have the right to publish this content';
function classifyUrl(raw){
  let s=String(raw||'').trim(); if(!s) return null;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s='https://'+s;
  let u; try{ u=new URL(s); }catch(e){ return {key:'bad'}; }
  if(!/^https?:$/.test(u.protocol) || !/^[\w.-]+\.[a-z]{2,}$/i.test(u.hostname) && !/^\[|^\d+\.\d+\.\d+\.\d+$/.test(u.hostname)) return {key:'bad'};
  u.hash=''; const h=u.hostname.toLowerCase().replace(/^www\./,''), seg=u.pathname.split('/').filter(Boolean), url=u.href, k=key=>({key,url});
  if(h==='github.com'){
    if(seg.length<2) return k('ghUser');
    if(seg[2]==='blob' && seg.length>=5) return k('file');
    if(seg[2]==='tree' && seg.length>=4) return k('folder');
    return seg.length===2 ? k('repo') : k('ghOther');
  }
  if(h==='gist.github.com') return k('gist');
  if(h==='raw.githubusercontent.com') return k('file');
  if(h==='youtu.be' || (/(^|\.)youtube\.com$/.test(h) && (u.pathname==='/watch' || seg[0]==='shorts')) || (/(^|\.)bilibili\.com$/.test(h) && seg[0]==='video')) return k('video');
  if(/\.pdf$/i.test(u.pathname)) return k('pdf');
  if(/\.(md|markdown|txt)$/i.test(u.pathname)) return k('md');
  return k('site');
}
const BAD_KINDS=['bad','ghUser','ghOther'];
/* Is this address in the public directory already? Answered from the directory the page has loaded, before anything is sent: the same spelling rules as the
   aggregator (urlKey), a repository or a folder under a listed repository counts too. The service and the Action check again; this only saves the visitor's time. */
function listedShelf(c){
  const d=state.dirData; if(!d || !c || BAD_KINDS.includes(c.key)) return '';
  const key=urlKey(c.url), nameOf=s=>(s&&(s.name||s.id))||'';
  const gh=u=>{ try{ const x=new URL(u); if(x.hostname.replace(/^www\./,'')!=='github.com') return null; const s=x.pathname.split('/').filter(Boolean); return s.length>=2 ? {o:s[0].toLowerCase(), r:s[1].toLowerCase().replace(/\.git$/,''), path:(s[2]==='tree'||s[2]==='blob') ? s.slice(4).join('/').toLowerCase() : ''} : null; }catch(e){ return null; } };
  const want=(c.key==='repo'||c.key==='folder') ? gh(c.url) : null;
  for(const s of d.shelves||[]){
    if([s.home,s.feed].some(u=>u && urlKey(u)===key)) return nameOf(s);
    if(want && s.kind==='repo'){ const have=gh(s.home); if(have && have.o===want.o && have.r===want.r && (!have.path || want.path===have.path || want.path.startsWith(have.path+'/'))) return nameOf(s); }
  }
  const it=(d.items||[]).find(i=>i.url && urlKey(i.url)===key);
