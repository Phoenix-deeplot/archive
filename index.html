  $('#gistSteps').innerHTML=t('gistSteps').map(x=>`<li>${esc(x)}</li>`).join('');
  const posts=shelfPosts(), pick=$('#postPick');
  pick.innerHTML=`<option value="">${esc(t('postPickNone'))}</option>`+posts.map(it=>`<option value="${esc(it.id)}">${esc(it.title)}</option>`).join('');
  $('#submitTabs').hidden=!submitApi();
  setSubmitTab(opts.tab||'url');
  submitDlg.showModal(); ($('#submitTabs').hidden || submitTab==='url' ? $('#submitUrl') : $('#postTitle')).focus();
  if(opts.url){ $('#submitUrl').value=opts.url; updateSubmit(); if(!$('#submitGo').disabled) runCheck(); }                // a card with an address of its own: that address, checked at once
  else if(opts.item && submitTab==='post'){ pick.value=opts.item.id; fillPostFrom(opts.item).then(()=>{ if(submitApi() && !$('#submitGo').disabled) runCheck(); }); }       // a card with an article: filled in and checked at once
  if(opts.note){ const w=$('#submitWarn'); w.textContent=opts.note; w.hidden=false; }                                          // a card with nothing to send: why, and what to do instead
}
async function sendSubmit(){
  const api=submitApi(), post=submitTab==='post';
  if(api && !submitCheck) return runCheck();
  if(!api){                                                          // no service: GitHub's own form (an address only)
    const c=classifyUrl($('#submitUrl').value), repo=submitRepo(); if(!c || !repo || BAD_KINDS.includes(c.key)) return;
    const u=new URL(c.url), q=new URLSearchParams({template:'submit.yml', title:('[收录] '+hostOf(c.url)+(u.pathname==='/'?'':u.pathname)).slice(0,80), url:c.url, rights:RIGHTS_OPTION});
    window.open(`https://github.com/${repo}/issues/new?${q}`,'_blank','noopener'); submitDlg.close(); return;
  }
  const payload = post ? {kind:'post', ...postData(), rights:true, website:$('#submitHp').value} : {kind:'url', url:classifyUrl($('#submitUrl').value).url, rights:true, website:$('#submitHp').value};
  $('#submitGo').disabled=true; setResult('…');
  try{
    const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.ok){
      if(submitFrom){ state.pubReq[submitFrom.id]=Date.now(); LS.set('pubReq',state.pubReq); }       // the card shows "waiting for review" until the directory lists it
      setResult(''); submitDlg.close(); toast(t('submitDone')); render(); return;
    }
    setResult(msgOf(d,r),'bad');
  }catch(e){ setResult(t('submitNet'),'bad'); }
  updateSubmit();
}
['#submitUrl','#postTitle','#postAuthor','#postTags','#postBody'].forEach(s=>$(s).addEventListener('input',()=>{ setResult(''); resetCheck(); updateSubmit(); }));
$('#submitRights').addEventListener('change',updateSubmit);
$('#submitCancel').addEventListener('click',()=>submitDlg.close()); $('#submitGo').addEventListener('click',sendSubmit);
$('#submitUrl').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!$('#submitGo').disabled) sendSubmit(); } });
document.querySelectorAll('[data-stab]').forEach(b=>b.addEventListener('click',()=>setSubmitTab(b.dataset.stab)));
$('#postPick').addEventListener('change',e=>{ const it=state.items.find(x=>x.id===e.target.value); if(it) fillPostFrom(it); });
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=s; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
$('#subBtn').addEventListener('click',openSubscribe);
$('#subClose').addEventListener('click',()=>subDlg.close());
$('#subList').addEventListener('click',async e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  const label=b.textContent;
  if(await copyText(b.dataset.copy)){ b.textContent=t('subCopied'); setTimeout(()=>{ b.textContent=label; },1500); }
  else window.prompt(label, b.dataset.copy);                 // the browser refused the clipboard: show the address, already selected
});

$('#moveList').addEventListener('click',e=>{ const b=e.target.closest('[data-to]'); if(b && !b.disabled) moveItem(moveDlg.dataset.id, b.dataset.to); });
$('#moveCancel').addEventListener('click',()=>moveDlg.close());

/* ================= events ================= */
$('#grid').addEventListener('click',e=>{                            // the parts of a card that exist in both spaces: tags, the shelf name, save
  const tg=e.target.closest('[data-tag]'); if(tg){ pickTag(tg.dataset.tag); return; }
  const sh=e.target.closest('[data-dshelf]'); if(sh){ state.dShelf=state.dShelf===sh.dataset.dshelf?'':sh.dataset.dshelf; state.dLimit=DIR_PAGE; render(); window.scrollTo({top:0}); return; }
  const sv=e.target.closest('[data-d="save"]'); if(sv){ const c=sv.closest('.card'); if(c) toggleSaveLink(c.dataset.did); }
});
$('#grid').addEventListener('error',e=>{                            // someone else's cover picture failed to load: the generated cover instead
  const im=e.target; if(!im || im.tagName!=='IMG' || !im.dataset.fb) return;
  const card=im.closest('.card'), it=card && (state.dirData && card.dataset.did ? state.dirData.items.find(x=>x.id===card.dataset.did) : state.items.find(x=>x.id===card.dataset.id));
  if(it) im.outerHTML=coverSVG(it);
},true);
$('#grid').addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const card=el.closest('.card'), id=card&&card.dataset.id; if(!id) return;
  const act=el.dataset.act;
  if(act==='open'){
    const it0=state.items.find(x=>x.id===id);
    if(it0 && it0.type==='link'){ if(el.tagName!=='A'){ e.preventDefault(); openReader(id); } return; }          // a saved link: the anchor opens it in a new tab by itself
    if(el.tagName==='A' && el.getAttribute('href')!=='#' && (e.metaKey||e.ctrlKey||e.shiftKey)) return; e.preventDefault(); openReader(id);
  }
  else if(act==='star') toggleStar(id);
  else if(act==='publish') publishItem(id);
  else if(act==='published') toast(t('publishDone'));
  else if(act==='hide') hideItem(id);
  else if(act==='restore') restoreItem(id);
  else if(act==='move') openMove(id);
  else if(act==='purge') purgeItem(id);
  else if(act==='shuffle'){ state.seeds[id]=(state.seeds[id]||0)+1; LS.set('seeds',state.seeds); const it=state.items.find(x=>x.id===id); const p=card.querySelector('.cover .prog'); card.querySelector('.cover').innerHTML=coverHTML(it,true)+(p?p.outerHTML:''); }
});
$('#continue').addEventListener('click',e=>{ const b=e.target.closest('[data-open]'); if(b) openReader(b.dataset.open); });
$('#cats').addEventListener('click',e=>{
  const dt=e.target.closest('[data-dtype]');                         // public directory: a type
  if(dt){ state.dType=dt.dataset.dtype; state.dLimit=DIR_PAGE; render(); window.scrollTo({top:0}); document.body.classList.remove('drawer'); return; }
  const b=e.target.closest('[data-cat]'); if(!b) return; state.cat=b.dataset.cat; render(); window.scrollTo({top:0}); document.body.classList.remove('drawer');
});
$('#tagbox').addEventListener('click',e=>{
  const fold=e.target.closest('[data-fold]'); if(fold){ state.tagsOpen=!state.tagsOpen; render(); return; }
  const tg=e.target.closest('[data-tag]'); if(tg) pickTag(tg.dataset.tag);
});
document.querySelectorAll('[data-space]').forEach(b=>b.addEventListener('click',()=>setSpace(b.dataset.space)));
$('.view-head').addEventListener('click',e=>{                        // the active filters above the cards: click one to drop it
  const c=e.target.closest('[data-clear]'); if(!c) return;
  const k=c.dataset.clear; if(k==='tag') state.tag=''; else if(k==='dtag') state.dTag=''; else if(k==='dshelf') state.dShelf='';
  state.dLimit=DIR_PAGE; render();
});
$('#moreBtn').addEventListener('click',()=>{ state.dLimit+=DIR_PAGE; render(); });
$('#dir').addEventListener('click',e=>{
  const sh=e.target.closest('[data-dshelf]');                       // public directory: one shelf
  if(sh){ state.dShelf=state.dShelf===sh.dataset.dshelf?'':sh.dataset.dshelf; state.dLimit=DIR_PAGE; render(); window.scrollTo({top:0}); document.body.classList.remove('drawer'); return; }
  const fold=e.target.closest('[data-fold]');                       // "show the other N" / "show less"
  if(fold){ const k=fold.dataset.fold; state.dirOpen.has(k)?state.dirOpen.delete(k):state.dirOpen.add(k); render(); return; }
  const head=e.target.closest('[data-cat]');                        // the coloured heading opens that category
  if(head){ state.cat=head.dataset.cat; render(); window.scrollTo({top:0}); document.body.classList.remove('drawer'); return; }
  const b=e.target.closest('[data-goto]'); if(!b) return; document.body.classList.remove('drawer');
  const card=document.querySelector(`.card[data-id="${CSS.escape(b.dataset.goto)}"]`);
  if(card){ card.scrollIntoView({behavior:'smooth',block:'center'}); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
});
$('#empty').addEventListener('click',e=>{
  if(e.target.closest('[data-retry]')){ loadDirectory(true); return; }
  if(e.target.closest('[data-clear]')){ state.q=''; state.lf='all'; state.tag=''; state.dType='all'; state.dTag=''; state.dShelf=''; state.dLimit=DIR_PAGE; $('#q').value=''; render(); }
});
let qTimer; $('#q').addEventListener('input',e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ state.q=e.target.value; state.dLimit=DIR_PAGE; render(); },120); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.target.value=''; state.q=''; render(); e.target.blur(); } });
$('#sort').addEventListener('change',e=>{ state.sort=e.target.value; LS.set('sort',state.sort); render(); });
$('#viewBtn').addEventListener('click',()=>{ state.view=state.view==='grid'?'list':'grid'; LS.set('view',state.view); render(); });
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{ state.lang=b.dataset.lang; LS.set('lang',state.lang); render(); if(dlg.open){ addCategories(); updateTarget(); renderPending(); } }));
document.querySelectorAll('[data-lf]').forEach(b=>b.addEventListener('click',()=>{ state.lf=b.dataset.lf; render(); }));
function applyTheme(){ if(state.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',state.theme); }
$('#themeBtn').addEventListener('click',()=>{ state.theme=state.theme==='auto'?'light':state.theme==='light'?'dark':'auto'; LS.set('theme',state.theme); applyTheme(); render(); });
$('#menuBtn').addEventListener('click',()=>document.body.classList.add('drawer'));
$('#sideClose').addEventListener('click',()=>document.body.classList.remove('drawer'));
document.addEventListener('click',e=>{ if(document.body.classList.contains('drawer') && !e.target.closest('.side') && !e.target.closest('#menuBtn')) document.body.classList.remove('drawer'); });
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if(!$('#reader').hidden){
    if(e.key==='Escape'){ e.preventDefault(); closeReader(); }
    else if(!typing && e.key==='ArrowLeft') step(-1);
    else if(!typing && e.key==='ArrowRight') step(1);
    return;
  }
  if(e.key==='/' && !typing && !dlg.open){ e.preventDefault(); $('#q').focus(); }
  else if(e.key==='Escape') document.body.classList.remove('drawer');
});
window.addEventListener('focus',()=>{ if($('#reader').hidden && !dlg.open && (state.mode==='server'||state.dir)) loadAll(); });

/* ================= boot ================= */
(async function boot(){
  if(location.hash==='#directory') state.space='dir';                   // a shareable address for the public directory
  applyTheme(); render(); syncSubscribe();
  try{ const h=await idb.get('dir'); if(h && h.queryPermission){ const p=await h.queryPermission({mode:'readwrite'}); if(p==='granted') state.dir=h; else state.dirPending=h; } }catch(e){}
  await loadAll();
  if(state.dirCfg) loadDirectory();                                   // also in my own shelf: it tells which of my pages are in the directory, and where posts are sent
  const m=location.hash.match(/^#read\/(.+)$/);
  if(m){ const id=decodeURIComponent(m[1]); history.replaceState(null,'',location.pathname+location.search); openReader(id); }
})();
})();
</script>
</body>
