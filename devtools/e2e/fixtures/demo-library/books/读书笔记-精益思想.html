<body><h1>读书笔记：精益思想</h1>
<p>精益的核心只有一句话：<b>从客户的角度定义价值，然后消除一切不创造价值的动作。</b></p>
<h2>五个原则</h2><ol><li>定义价值</li><li>识别价值流</li><li>让价值流动起来</li><li>由客户拉动</li><li>追求尽善尽美</li></ol>
<h2>在仓库里</h2><p>拣货路线越短、等待越少，浪费就越少。</p></body></html>
