<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存周转计算器</title>
<meta name="description" content="输入销售成本和平均库存，立刻算出周转率和周转天数。">
<link rel="stylesheet" href="style.css"></head>
<body><main><h1>库存周转计算器</h1>
<label>年销售成本（元）<input id="c" type="number" value="1200000"></label>
<label>平均库存金额（元）<input id="s" type="number" value="300000"></label>
<p class="out">周转率 <b id="r">4.0</b> 次 / 年，约 <b id="d">91</b> 天周转一次</p></main>
<script src="app.js"></script></body></html>
